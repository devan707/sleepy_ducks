<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta
      name="description"
      content="Tap sleeping ducks before they fall into the waterfall. A mobile arcade game — best in portrait on your phone."
    />
    <title>Sleepy Ducks</title>
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sleepy Ducks" />
    <meta
      property="og:description"
      content="Tap sleeping ducks before they fall into the waterfall. Best on phone, portrait mode."
    />
    <meta property="og:url" content="https://sleepy-ducks.pages.dev/" />
    <meta property="og:image" content="https://sleepy-ducks.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sleepy Ducks" />
    <meta
      name="twitter:description"
      content="Tap sleeping ducks before they fall into the waterfall. Best on phone, portrait mode."
    />
    <meta name="twitter:image" content="https://sleepy-ducks.pages.dev/og-image.png" />
    <link
      rel="preload"
      href="assets/music/Riverbank_Picnic.mp3"
      as="fetch"
      type="audio/mpeg"
      crossorigin
    />
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        touch-action: manipulation;
      }
      #game-container {
        width: 100%;
        height: 100%;
      }
      .sd-player-name-input {
        display: none;
        position: fixed;
        z-index: 10000;
        margin: 0;
        padding: 0 14px;
        border: 3px solid rgba(255, 255, 255, 0.65);
        border-radius: 14px;
        background: rgba(45, 122, 154, 0.92);
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 16px;
        font-weight: 700;
        outline: none;
        box-shadow:
          0 4px 14px rgba(0, 0, 0, 0.35),
          inset 0 2px 8px rgba(255, 255, 255, 0.15);
      }
      .sd-player-name-input::placeholder {
        color: #8ab4c8;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
