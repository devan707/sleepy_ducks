<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0e1e28" />
    <meta
      name="description"
      content="Tap sleeping ducks before they fall into the waterfall. A mobile arcade game — best in portrait on your phone."
    />
    <title>Sleepy Ducks</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sleepy Ducks" />
    <meta
      property="og:description"
      content="Tap sleeping ducks before they fall into the waterfall. Best on phone, portrait mode."
    />
    <meta property="og:url" content="https://sleepyducks.app/" />
    <meta property="og:image" content="https://sleepyducks.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sleepy Ducks" />
    <meta
      name="twitter:description"
      content="Tap sleeping ducks before they fall into the waterfall. Best on phone, portrait mode."
    />
    <meta name="twitter:image" content="https://sleepyducks.app/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap"
    />
    <link
      rel="preload"
      href="assets/music/Riverbank_Picnic.mp3"
      as="fetch"
      type="audio/mpeg"
      crossorigin
    />
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e1e28;
        touch-action: manipulation;
      }
      #game-container {
        width: 100%;
        height: 100%;
      }
      .sd-player-name-input {
        display: none;
        position: fixed;
        box-sizing: border-box;
        margin: 0;
        padding: 0 10px;
        border: none;
        border-radius: 0;
        background: transparent;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 16px;
        font-weight: 700;
        outline: none;
        pointer-events: auto;
        touch-action: manipulation;
        -webkit-user-select: text;
        user-select: text;
        z-index: 10000;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
        caret-color: #ffe566;
      }
      .sd-player-name-input::placeholder {
        color: rgba(255, 255, 255, 0.55);
        font-weight: 600;
      }
      .sd-install-prompt {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
        display: flex;
        justify-content: center;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
        opacity: 0;
        transform: translateY(16px);
        transition: opacity 0.35s ease, transform 0.35s ease;
      }
      .sd-install-prompt--visible {
        opacity: 1;
        transform: translateY(0);
      }
      .sd-install-prompt__panel {
        position: relative;
        width: min(100%, 380px);
        padding: 16px 44px 16px 18px;
        border-radius: 16px;
        background: rgba(10, 24, 36, 0.92);
        border: 2px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        pointer-events: auto;
        font-family: system-ui, -apple-system, sans-serif;
        color: #ecf8ff;
      }
      .sd-install-prompt__dismiss {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 32px;
        height: 32px;
        margin: 0;
        padding: 0;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: #b8d4e8;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        touch-action: manipulation;
      }
      .sd-install-prompt__title {
        font-size: 17px;
        font-weight: 800;
        color: #ffe566;
        margin-bottom: 8px;
        padding-right: 8px;
      }
      .sd-install-prompt__body {
        font-size: 14px;
        line-height: 1.45;
        color: #e8f4fc;
        margin-bottom: 14px;
      }
      .sd-install-prompt__body strong {
        color: #ffffff;
      }
      .sd-install-prompt__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .sd-install-prompt__primary,
      .sd-install-prompt__secondary {
        margin: 0;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
        border: none;
      }
      .sd-install-prompt__primary {
        background: #ffe566;
        color: #1a3a4a;
      }
      .sd-install-prompt__secondary {
        background: rgba(255, 255, 255, 0.12);
        color: #ecf8ff;
        border: 1px solid rgba(255, 255, 255, 0.22);
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
